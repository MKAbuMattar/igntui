[project]
name = "igntui"
version = "0.2.0"
description = "Interactive Terminal User Interface for GitIgnore template generation"
readme = "README.md"
license = "GPL-3.0-or-later"
# Without this the SPDX field is set but the licence text ships in neither the
# wheel nor the sdist. The dead `[tool.hatch.build] include` never applied: the
# build backend is uv_build.
license-files = ["LICENSE"]
authors = [
    { name = "Mohammad Abu Mattar", email = "mohammad.khaled@outlook.com" }
]
maintainers = [
    { name = "Mohammad Abu Mattar", email = "mohammad.khaled@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "windows-curses>=2.4.1; sys_platform == 'win32'",
    "pyfiglet>=1.0.2",
    "tomli-w>=1.0.0",
]
keywords = ["gitignore", "tui", "terminal", "git", "templates", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MKAbuMattar/igntui"
Repository = "https://github.com/MKAbuMattar/igntui"
Documentation = "https://github.com/MKAbuMattar/igntui/blob/main/README.md"
Issues = "https://github.com/MKAbuMattar/igntui/issues"

[project.scripts]
igntui = "igntui.main:cli_main"
gitignore-tui = "igntui.main:tui_main"

[project.optional-dependencies]
# Only what CI actually invokes. `black`, `isort`, `flake8`, `mypy`, `hatch` and
# `pre-commit` were declared here and never run by anything: ruff covers the
# first three, `ty` does the type-checking, and the build backend is uv_build.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "freezegun>=1.4.0",
]
windows = [
    "windows-curses>=2.4.1; sys_platform == 'win32'",
]

[build-system]
# Upper bound kept wide on purpose: a narrow minor pin makes every build with a
# newer uv print `build_system.requires does not contain the current uv version`.
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

# Enable specific rule sets
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (includes B904 — raise X from err)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # function is too complex
    "E402",  # module-level import not at top — needed for tomllib version-guarded import
    "W291",  # trailing whitespace (cosmetic)
    "W293",  # blank line contains whitespace (cosmetic)
    "C408",  # unnecessary dict() call (style)
    "C414",  # unnecessary list() within sorted (style)
]

# Exclude directories
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when ready for full type checking
ignore_missing_imports = true

# Per-module options
[[tool.mypy.overrides]]
module = ["curses", "curses.*", "windows_curses", "windows_curses.*"]
ignore_missing_imports = true
ignore_errors = true

# Type checking with ty (https://docs.astral.sh/ty/)
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/igntui"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: tests that hit the network or filesystem extensively",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/igntui"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/tui/curses_setup.py",
    "*/tui/renderer.py",
    "*/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

# Nothing else belongs here. The `[tool.hatch.*]` tables that used to follow —
# build targets, metadata, an env with black/isort/mypy/twine, and `fmt`/`lint`
# scripts pointing at them — were inert: the build backend is uv_build, and CI
# runs ruff, ty and pytest. `[tool.isort]` also set line_length = 88 against
# ruff's 100. See AGENTS.md for the commands that are real.