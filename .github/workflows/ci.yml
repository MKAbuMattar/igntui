name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Pin Python at the job level so every `uv` invocation (sync, run, tool)
    # picks the same interpreter. Without this, `uv run` falls back to the
    # system Python and rebuilds the venv without extras → ruff/pytest go
    # missing on the next step.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project + test + dev extras
        run: uv sync --extra test --extra dev

      - name: Lint with ruff
        # Use uvx (isolated tool run) — doesn't depend on project venv state
        # and doesn't trigger a re-sync.
        run: uvx ruff check src tests scripts

      # The tree was black-formatted at a different width and `ruff format` was
      # configured but never run, so 43 of 73 files disagreed with it. Now that
      # the reformat has landed, this keeps it from drifting again.
      - name: Check formatting
        run: uvx ruff format --check src tests scripts

      - name: Type-check with ty
        # ty is alpha (https://docs.astral.sh/ty/) but this is a required step.
        # Scope was `src/igntui/core` while the rest of the tree had
        # diagnostics; those are fixed, so the whole package is checked now.
        run: uvx ty check --python .venv src/igntui

      # Two files carry the version and they drift silently: the mismatch only
      # shows up as a mislabelled release on PyPI.
      - name: Versions agree
        run: uv run --frozen python scripts/release_version.py assert-consistent

      - name: Run tests with coverage
        # --frozen tells uv to use the existing venv as-is; no resolution.
        run: uv run --frozen pytest tests/ --cov --cov-report=term-missing

  build:
    name: build (sanity)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel + sdist
        run: uv build

      - name: Verify package metadata
        run: uv tool run --from twine twine check dist/*
