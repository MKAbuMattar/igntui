name: release

# Driven entirely by a pull request:
#
#   1. branch off main as  release/0.2.0   (the version comes from the name)
#   2. open a PR to main and add the  release  label
#   3. `prepare` bumps both version files, pushes that to your branch, and
#      proves the result builds, installs and runs
#   4. merge the PR
#   5. `publish` uploads to PyPI, tags it, and writes the Release page
#
# The split matters: nothing irreversible happens while the PR is open. Merging
# is the act that publishes, so the PR diff is a preview of exactly what ships.
# PyPI does not allow re-uploading a version — a mistaken merge burns that
# number permanently, so the point of no return is one deliberate click.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read

concurrency:
  # Never let two releases race. Not cancel-in-progress: killing a job halfway
  # through an upload is how you get a half-published version.
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare ${{ github.event.pull_request.head.ref }}
    if: >-
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read the version out of the branch name
        id: version
        run: |
          version="${GITHUB_HEAD_REF#release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      # Rejects a malformed or backwards version before anything is written.
      - name: Check it is a legal next version
        run: python3 scripts/release_version.py check "${{ steps.version.outputs.version }}"

      - name: Bump both version files and roll the changelog
        run: python3 scripts/release_version.py apply "${{ steps.version.outputs.version }}"

      - name: Push the bump back to the pull request
        run: |
          if git diff --quiet; then
            echo "Already prepared, nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.version.outputs.version }}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      # The same gate ci.yml runs. A release must not lower the bar.
      - name: Install project + test + dev extras
        run: uv sync --extra test --extra dev

      - name: Lint
        run: uvx ruff check src tests

      - name: Type-check
        run: uvx ty check --python .venv src/igntui

      - name: Tests
        run: uv run --frozen pytest tests/ -q

      - name: Build
        run: uv build

      - name: Check the metadata PyPI will see
        run: uv tool run --from twine twine check dist/*

      # Proves the artifact installs and runs before it is ever uploaded.
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          # Glob, not `ls` — its output is not safe to parse.
          wheels=(dist/*.whl)
          [ -e "${wheels[0]}" ] || { echo "::error::no wheel was built"; exit 1; }
          uvx --from "${wheels[0]}" igntui --version
          uvx --from "${wheels[0]}" igntui completion bash > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 7

      - name: Say what merging will do
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const body = [
              `### Release \`v${version}\` is ready`,
              '',
              'Prepared and verified. Both version files are bumped on this branch,',
              'lint, types and tests pass, and the built wheel installs and runs.',
              '',
              '**Merging this pull request will publish to PyPI.** That cannot be undone —',
              `PyPI does not allow re-uploading a version, so a mistake means burning \`${version}\`.`,
              '',
              'On merge: upload to PyPI &rarr; confirm PyPI serves it &rarr; tag `v' + version + '` &rarr; Release page.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '### Release `v';
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  publish:
    name: publish to PyPI
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    # The PYPI_API_TOKEN secret lives on this environment:
    #   gh api --method PUT repos/MKAbuMattar/igntui/environments/pypi
    #   gh secret set PYPI_API_TOKEN --repo MKAbuMattar/igntui --env pypi
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read the version out of the branch name
        id: version
        run: echo "version=${GITHUB_HEAD_REF#release/}" >> "$GITHUB_OUTPUT"

      # Refuses to publish if the merged tree does not actually carry the
      # version the branch name promises.
      - name: Confirm the merged tree is at that version
        run: python3 scripts/release_version.py assert "${{ steps.version.outputs.version }}"

      - name: Build
        run: uv build

      - name: Check the metadata
        run: uv tool run --from twine twine check dist/*

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is not set on the 'pypi' environment." \
                 "Add it with: gh secret set PYPI_API_TOKEN --repo" \
                 "${{ github.repository }} --env pypi"
            exit 1
          fi
          uv publish

      # An upload can succeed and still serve nothing. Poll until it is real.
      - name: Confirm PyPI is serving it
        run: python3 scripts/release_version.py verify "${{ steps.version.outputs.version }}"

      - name: Tag the release commit
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "igntui v$version"
          git push origin "v$version"

      - name: Changelog section for the release body
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            python3 scripts/release_version.py notes "${{ steps.version.outputs.version }}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release page
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            ```bash
            pipx install igntui==${{ steps.version.outputs.version }}
            ```

            [PyPI](https://pypi.org/project/igntui/${{ steps.version.outputs.version }}/)
          # Explicit, not `dist/*`: uv writes a `dist/.gitignore` containing `*`,
          # which the glob picked up and GitHub attached as `default.gitignore`
          # (asset names cannot start with a dot). One stray byte per release.
          files: |
            dist/*.whl
            dist/*.tar.gz
          make_latest: true
